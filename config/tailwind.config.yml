content:
  - ./app/views/**/*.html.erb
  - ./app/helpers/**/*.rb
  - ./app/javascript/**/*.js
  - ./app/assets/stylesheets/**/*.css

theme:
  extend: {}

plugins: []

# Tell Tailwind where the input file is and where to output the built CSS
input: app/assets/tailwind/application.css
output: app/assets/builds/application.css
